name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hackhub
          MYSQL_USER: hackhub
          MYSQL_PASSWORD: 1234abc
          MYSQL_ROOT_PASSWORD: 1234abc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p1234abc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: hackhub-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          DB_HOST: localhost
          DB_PORT: "3306"
          DB_NAME: hackhub
          DB_USERNAME: hackhub
          DB_PASSWORD: 1234abc

          APP_JWT_SECRET: testsecret
          APP_JWT_EXPIRATION_MS: "3600000"
          SERVER_PORT: "8081"
          
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            hackhub-backend/build/reports/tests/test
            hackhub-backend/build/test-results/test