services:
  mysql:
    image: mysql:8.0
    container_name: hackhub-mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - hackhub_mysql_data:/var/lib/mysql
    expose:
      - "3306"

  backend:
    build: .
    container_name: hackhub-backend
    depends_on:
      - mysql
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  frontend:
    build: ./hackhub-frontend
    container_name: hackhub-frontend
    depends_on: 
      - backend
    ports: 
      - 5173:5173

volumes:
  hackhub_mysql_data:
